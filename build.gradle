plugins {
  id 'java'
  id 'groovy'
  id "com.katalon.gradle-plugin" version "0.2.0"
}

repositories {
  mavenCentral()
}

sourceSets {
  main {
    groovy {
      srcDirs = ['Keywords', 'Test Listeners', 'Include/scripts/groovy']
      srcDir 'Libs'
    }
  }
}

shadowJar {
  exclude 'Temp*.class'
}

katalon {
  dependencyPrefix = "com.katalon"
  minimize = false
}